name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包插件
        run: ./build.sh

      - name: 创建 Release 并上传 .iinaplgz
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.iinaplgz
          generate_release_notes: true
